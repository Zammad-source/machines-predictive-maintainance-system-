<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Predictive Maintenance System</title>
<style>
  :root {
    --bg: #14181c;
    --panel: #1c2127;
    --border: #2c333b;
    --text: #e8ebee;
    --muted: #8a94a1;
    --amber: #e8a33d;
    --amber-dim: #4a3820;
    --danger: #d9534f;
    --ok: #4caf7d;
    --mono: 'Consolas', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 40px);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .header {
    padding: 22px 28px;
    border-bottom: 3px solid var(--amber);
    background: linear-gradient(180deg, #20262d, #1c2127);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--amber);
    margin: 0 0 6px;
  }

  h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  form {
    padding: 24px 28px 8px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    background: #12161a;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--mono);
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--amber);
  }

  button {
    width: 100%;
    padding: 13px;
    margin: 14px 0 24px;
    background: var(--amber);
    border: none;
    border-radius: 3px;
    color: #1c1a15;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }

  button:hover { background: #f2b451; }

  .result {
    margin: 0 28px 26px;
    padding: 16px 18px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-left: 4px solid;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result.fail {
    background: rgba(217, 83, 79, 0.12);
    border-color: var(--danger);
    color: #ff8f8c;
  }

  .result.ok {
    background: rgba(76, 175, 125, 0.12);
    border-color: var(--ok);
    color: #7fe0ab;
  }

  .result span.tag {
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <p class="eyebrow">INDUSTRIAL AI &middot; CONDITION MONITORING</p>
      <h1>Smart Predictive Maintenance System</h1>
    </div>

    <form method="POST">
      <div class="field">
  <label>Model</label>
  <select name="model" required>
    <option value="random_forest">Random Forest</option>
    <option value="xgboost">XGBoost</option>
    <option value="decision_tree">Decision Tree</option>
    <option value="lightgbm">LightGBM</option>
  </select>
</div>
      <div class="field">
        <label>Product Type</label>
        <select name="type" required>
          <option value="L">L — Low</option>
          <option value="M">M — Medium</option>
          <option value="H">H — High</option>
        </select>
      </div>

      <div class="field">
        <label>Air Temperature [K]</label>
        <input type="number" step="0.1" name="air_temp" required>
      </div>

      <div class="field">
        <label>Process Temperature [K]</label>
        <input type="number" step="0.1" name="process_temp" required>
      </div>

      <div class="field">
        <label>Rotational Speed [rpm]</label>
        <input type="number" step="1" name="rot_speed" required>
      </div>

      <div class="field">
        <label>Torque [Nm]</label>
        <input type="number" step="0.1" name="torque" required>
      </div>

      <div class="field">
        <label>Tool Wear [min]</label>
        <input type="number" step="1" name="tool_wear" required>
      </div>

      <button type="submit">Predict</button>
    </form>

    {% if result %}
      <div class="result {{ 'fail' if result == 'Failure' else 'ok' }}">
        <span>{{ result }}</span>
        <span class="tag">PREDICTION RESULT</span>
      </div>
    {% endif %}
  </div>
</body>
</html>
